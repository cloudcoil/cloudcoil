site_name: cloudcoil
site_url: https://cloudcoil.github.io/cloudcoil/
site_author: Sambhav Kothari
site_description: Cloud-native made easy with Python

repo_name: cloudcoil/cloudcoil
repo_url: https://github.com/cloudcoil/cloudcoil

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tabs
  language: en

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Resources: resources.md
      - Logs: logs.md
      - Model generation: models.md
      - Model integrations: integrations.md
      - Maintaining model packages: model-releases.md
      - Custom resources: custom-resources.md
      - Controllers: controllers.md
      - Live clients and informer reads: reads.md
      - Admission: admission.md
      - Application deployment: operators.md
      - Patterns: patterns.md
  - Advanced:
      - Client caching and informers: caching.md
      - Runtime and observability: runtime.md
      - Testing: testing.md
  - API reference: api.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.extra
  - pymdownx.superfences

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          rendering:
            show_root_heading: false
            show_root_full_path: false
            show_root_toc_entry: false
            show_source: false
            heading_level: 4
            show_signature_annotations: true
