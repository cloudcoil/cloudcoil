name: Run tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test-python:
    env:
      CLOUDCOIL_K8S_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version:
          - "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra kubernetes --dev

      - name: Run Checks
        run: make UV_RUN_FLAGS=--no-sync lint test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: cloudcoil/cloudcoil
    
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-k8s:
    strategy:
      fail-fast: false
      matrix:
        # Models and server patch releases are independent. These published images
        # were published with Kind v0.27.0: https://github.com/kubernetes-sigs/kind/releases/tag/v0.27.0
        include:
          - k8s-version: "1-29"
            image: kindest/node:v1.29.14@sha256:8703bd94ee24e51b778d5556ae310c6c0fa67d761fae6379c8e0bb480e6fea29
          - k8s-version: "1-30"
            image: kindest/node:v1.30.10@sha256:4de75d0e82481ea846c0ed1de86328d821c1e6a6a91ac37bf804e5313670e507
          - k8s-version: "1-31"
            image: kindest/node:v1.31.6@sha256:28b7cbb993dfe093c76641a0c95807637213c9109b761f1d422c2400e22b8e87
          - k8s-version: "1-32"
            image: kindest/node:v1.32.2@sha256:f226345927d7e348497136874b6d207e0b32cc52154ad8323129352923a3142f
    env:
      CLOUDCOIL_K8S_IMAGE: ${{ matrix.image }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: |
          uv sync --extra "kubernetes-${{ matrix.k8s-version }}" --dev
          uv run --no-sync python -c 'from importlib.metadata import version; assert version("cloudcoil.models.kubernetes").startswith("${{ matrix.k8s-version }}".replace("-", ".") + ".")'

      - name: Run Checks
        run: make UV_RUN_FLAGS=--no-sync lint test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: cloudcoil/cloudcoil
    
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-provider:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cluster-provider: k3d
            image: rancher/k3s:v1.36.4-k3s1
          - cluster-provider: kind
            image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    env:
      CLOUDCOIL_K8S_IMAGE: ${{ matrix.image }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Install dependencies
        run: uv sync --extra kubernetes --dev

      - name: Run Checks
        run: make UV_RUN_FLAGS=--no-sync lint test
        env:
          CLUSTER_PROVIDER: ${{ matrix.cluster-provider }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: cloudcoil/cloudcoil
    
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-k8s-latest:
    name: test-k8s (1.37, generated models)
    runs-on: ubuntu-latest
    env:
      CLOUDCOIL_K8S_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra kubernetes --extra codegen --dev
      - name: Generate and install Kubernetes 1.37 models
        run: |
          uv run --no-sync python tools/generate_kubernetes.py --version 1.37.0 --output /tmp/kubernetes-models
          uv pip install --python .venv/bin/python --no-deps /tmp/kubernetes-models
          uv run --no-sync python -c 'from importlib.metadata import version; assert version("cloudcoil.models.kubernetes") == "1.37.0.0"'
      - name: Run Checks with the generated models
        run: make UV_RUN_FLAGS=--no-sync lint test
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
