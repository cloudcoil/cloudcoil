
name: Update Versions

on:
  push:
    branches:
      - main
    paths:
      - "cookiecutter/**"
      - "models/**"
      - "Makefile"
      - ".github/workflows/update_repos.yml"
  workflow_dispatch:
  repository_dispatch:
    types: [update-repos]
concurrency:
  group: regenerate-model-repositories
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.select.outputs.models }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        run: |
          python - <<'PY'
          import json, os, pathlib
          models = sorted(p.parent.name for p in pathlib.Path('models').glob('*/cookiecutter.yaml'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print('models=' + json.dumps(models), file=f)
          PY
  update-repos:
    needs: select
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.select.outputs.models) }}
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.CI_GITHUB_TOKEN }}

      - name: Install uv and set python
        uses: astral-sh/setup-uv@v4
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"

      - name: Generate and publish the model repository
        env:
          MODEL: ${{ matrix.model }}
          GITHUB_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          make "publish-repo-$MODEL"
